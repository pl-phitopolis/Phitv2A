<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder poster: glass office tower flythrough, hero-approach segment">
  <!--
    media-forge provenance — rung ② authored (hand-drawn SVG poster frame), rung ③ for the
    full flythrough sequence (see manifest.json in this directory for the generation prompt
    pack, palette lock, and placeholder frame count). This poster is an original vector
    composition, not a photograph or third-party asset — no external license applies.
    Palette source: src/shared/theme/palette.ts (NOIR tokens) — no hex below appears
    outside that file's values.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04122E"/>
      <stop offset="55%" stop-color="#06183B"/>
      <stop offset="100%" stop-color="#061226"/>
    </linearGradient>
    <linearGradient id="towerFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A1833"/>
      <stop offset="50%" stop-color="#0A2A66"/>
      <stop offset="100%" stop-color="#081F4D"/>
    </linearGradient>
    <linearGradient id="towerFaceB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#182647"/>
      <stop offset="100%" stop-color="#0A1833"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4F7FC" stop-opacity="0.14"/>
      <stop offset="35%" stop-color="#F4F7FC" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#F4F7FC" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- distant flanking towers, low contrast, establishes depth for the push-in -->
  <g opacity="0.55">
    <rect x="120" y="360" width="180" height="720" fill="#0A1833"/>
    <rect x="340" y="300" width="140" height="780" fill="#081F4D"/>
    <rect x="1500" y="330" width="150" height="750" fill="#081F4D"/>
    <rect x="1680" y="380" width="170" height="700" fill="#0A1833"/>
  </g>

  <!-- window grid on the distant towers, sparse -->
  <g fill="#94A3B8" opacity="0.10">
    <rect x="140" y="400" width="140" height="640" fill="none" stroke="#94A3B8" stroke-width="1"/>
  </g>

  <!-- hero tower — the camera's target, dead-center, glass curtain wall -->
  <g>
    <rect x="660" y="120" width="300" height="960" fill="url(#towerFace)"/>
    <rect x="960" y="160" width="300" height="920" fill="url(#towerFaceB)"/>

    <!-- mullion grid: restrained, evenly spaced, no clutter -->
    <g stroke="#04122E" stroke-width="2" opacity="0.9">
      <!-- verticals -->
      <line x1="710" y1="120" x2="710" y2="1080"/>
      <line x1="760" y1="120" x2="760" y2="1080"/>
      <line x1="810" y1="120" x2="810" y2="1080"/>
      <line x1="860" y1="120" x2="860" y2="1080"/>
      <line x1="910" y1="120" x2="910" y2="1080"/>
      <line x1="1010" y1="160" x2="1010" y2="1080"/>
      <line x1="1060" y1="160" x2="1060" y2="1080"/>
      <line x1="1110" y1="160" x2="1110" y2="1080"/>
      <line x1="1160" y1="160" x2="1160" y2="1080"/>
      <line x1="1210" y1="160" x2="1210" y2="1080"/>
    </g>
    <g stroke="#04122E" stroke-width="2" opacity="0.7">
      <!-- horizontals, floor lines -->
      <line x1="660" y1="220" x2="960" y2="220"/>
      <line x1="660" y1="320" x2="960" y2="320"/>
      <line x1="660" y1="420" x2="960" y2="420"/>
      <line x1="660" y1="520" x2="960" y2="520"/>
      <line x1="660" y1="620" x2="960" y2="620"/>
      <line x1="660" y1="720" x2="960" y2="720"/>
      <line x1="660" y1="820" x2="960" y2="820"/>
      <line x1="660" y1="920" x2="960" y2="920"/>
      <line x1="960" y1="260" x2="1260" y2="260"/>
      <line x1="960" y1="360" x2="1260" y2="360"/>
      <line x1="960" y1="460" x2="1260" y2="460"/>
      <line x1="960" y1="560" x2="1260" y2="560"/>
      <line x1="960" y1="660" x2="1260" y2="660"/>
      <line x1="960" y1="760" x2="1260" y2="760"/>
      <line x1="960" y1="860" x2="1260" y2="860"/>
      <line x1="960" y1="960" x2="1260" y2="960"/>
    </g>

    <!-- a handful of lit interior offices — sparse, deliberate, reads as occupied R&D floors -->
    <g fill="#FFC72C" opacity="0.85">
      <rect x="762" y="422" width="46" height="96"/>
      <rect x="862" y="622" width="46" height="96"/>
      <rect x="1062" y="362" width="46" height="96"/>
      <rect x="1162" y="762" width="46" height="96"/>
    </g>
    <g fill="#F4F7FC" opacity="0.30">
      <rect x="712" y="222" width="46" height="96"/>
      <rect x="1012" y="562" width="46" height="96"/>
    </g>

    <!-- glass sheen overlay -->
    <rect x="660" y="120" width="600" height="500" fill="url(#glassSheen)"/>
  </g>

  <!-- foreground haze band, grounds the push-in without adding detail -->
  <rect x="0" y="900" width="1920" height="180" fill="#061226" opacity="0.35"/>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
