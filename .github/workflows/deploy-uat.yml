name: Build UAT image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Rollback: existing GHCR tag (uat-<sha>) to point :uat back at. Leave empty to build from this ref."
        required: false
        type: string

permissions:
  contents: read
  packages: write

# One build at a time so `:uat` always moves forward in push order. The UAT box
# deploys itself: it polls this tag's digest and runs deploy/deploy-uat.sh from
# the commit baked into the image's revision label (see deploy/README-CD.md).
# Nothing here executes on the box — no self-hosted runner, on purpose: this is
# a public repo and a runner would let a fork PR run code on the UAT host.
concurrency:
  group: uat-deploy-fresko
  cancel-in-progress: false

jobs:
  # Reuses ci.yml's verify job so a push to main can't reach UAT with a red
  # build. Skipped on a rollback dispatch (image_tag set) — the image already
  # passed this when it was built, and the source tree may have moved on since.
  verify:
    if: ${{ inputs.image_tag == '' }}
    uses: ./.github/workflows/ci.yml

  build:
    name: Build & push arm64 image
    if: ${{ inputs.image_tag == '' }}
    # Native arm64 GitHub-hosted runner — the UAT box is aarch64 and this repo's
    # build has OOM-killed that 3.4 GB host before. Building on a matching-arch
    # hosted runner means no QEMU emulation and no build ever touches the box.
    runs-on: ubuntu-24.04-arm
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: tag
        run: echo "image_tag=uat-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # The box reads this label after pulling to check out the matching
          # commit and run that commit's deploy/deploy-uat.sh.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VITE_API_URL=/
            VITE_SITE_URL=https://uat.phitopolis.io
          tags: |
            ghcr.io/yakovins-miletus/fresko:uat-${{ github.sha }}
            ghcr.io/yakovins-miletus/fresko:uat
          cache-from: type=gha
          cache-to: type=gha


  # Rollback = move the `:uat` tag back to an older `uat-<sha>` on GHCR. The box
  # notices the digest change within a minute and redeploys that image (and,
  # via its revision label, that commit's compose file).
  rollback:
    name: Point :uat at ${{ inputs.image_tag }}
    if: ${{ inputs.image_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create -t ghcr.io/yakovins-miletus/fresko:uat ghcr.io/yakovins-miletus/fresko:"${{ inputs.image_tag }}"
